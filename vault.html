<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="คลังคำตอบ Speexx — ค้นหาโจทย์และเฉลยทุกข้อ">
  <title>คลังคำตอบ Speexx — ค้นหาเฉลย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M40 22c-2.4-2.3-5.4-3.4-9-3.4-5.2 0-8.8 2.6-8.8 6.6 0 4.1 3.4 5.6 8.6 6.9 6 1.5 9.2 3.7 9.2 8.7 0 5.5-4.6 9.2-11.4 9.2-4.6 0-8.6-1.5-11.4-4.3' fill='none' stroke='%237fd1c0' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="กลับหน้าแรก">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-copy">
          <strong>SPEXX</strong>
          <small>ANSWER VAULT</small>
        </span>
      </a>
      <a class="btn-home" href="index.html">กลับหน้าแรก</a>
    </div>
  </header>

  <main class="page vault-page" role="search">

    <div class="container">

      <!-- Search bar -->
      <div class="search-wrap">
        <div class="search-inner">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/>
            <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
                 placeholder="พิมพ์คำจากโจทย์หรือคำตอบ…" aria-label="ค้นหาคำถามและคำตอบ">
          <button class="search-clear" id="clearBtn" type="button" aria-label="ล้างคำค้นหา" hidden>✕</button>
        </div>
        <div class="search-opt-row">
          <button type="button" class="search-opt" data-opt="case" aria-pressed="false" title="ตรงตามตัวพิมพ์เล็ก/ใหญ่">Aa</button>
          <button type="button" class="search-opt" data-opt="word" aria-pressed="false" title="ค้นหาทั้งคำ">ab</button>
          <button type="button" class="search-opt" data-opt="regex" aria-pressed="false" title="ค้นหาด้วย Regular Expression">.*</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="chapter-pills" id="chapterPills"></div>
        <div class="filter-controls">
          <label class="filter-label">ประเภท:
            <select id="typeFilter" aria-label="กรองตามประเภทคำตอบ"></select>
          </label>
          <button class="toggle-pill" id="imageToggle" type="button" aria-pressed="false">เฉพาะข้อที่มีรูป</button>
          <button class="text-btn" id="resetFilters">ล้างตัวกรอง</button>
          <span class="key-hint"><kbd>Ctrl</kbd><kbd>K</kbd> ค้นหา</span>
        </div>
      </div>

      <!-- Active filters -->
      <div id="activeFilters" class="active-filters"></div>

      <!-- Results count -->
      <div class="results-head">
        <span id="resultCount">กำลังโหลด…</span>
        <span id="searchTime" class="search-time"></span>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="empty" hidden>
        <div class="empty-mark">∅</div>
        <h2 id="emptyTitle">ไม่พบคำตอบที่ตรงกัน</h2>
        <p id="emptyMsg">ลองพิมพ์คำสั้นลง เปลี่ยนตัวพิมพ์ หรือปิดตัวกรองบางตัวดูนะครับ</p>
        <button class="btn-primary" id="emptyReset" type="button">ล้างคำค้นหาและตัวกรอง</button>
      </div>

      <!-- Results list (vertical, not grid) -->
      <div id="results" class="results-list"></div>

      <!-- Load more -->
      <div class="load-more-wrap">
        <button class="load-more" id="loadMore" type="button" hidden>โหลดเพิ่ม</button>
      </div>

    </div>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Speexx Answer Vault — คลังคำตอบเพื่อการฝึกภาษา · ใช้งานฟรีไม่เสียค่าใช้จ่าย</p>
      <a class="text-link" href="index.html">กลับหน้าแรก</a>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
